[package]
name = "lastengine"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
description = "Clean-room LLM inference engine for MoE models on small GPUs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-stream = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
fancy-regex = "0.20.0"
minijinja = { version = "3.0.5", features = ["json", "builtins", "serde", "loop_controls", "preserve_order", "macros", "multi_template"] }
minijinja-contrib = { version = "3.0.5", features = ["pycompat"] }
memmap2 = "0.9.12"
rayon = "1.12.0"
cudarc = { version = "0.19.10", default-features = false, features = ["driver", "nvrtc", "cuda-13040", "dynamic-loading"] }
