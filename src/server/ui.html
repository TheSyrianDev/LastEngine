<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LastEngine</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mut:#8a8a8e;--me:#e8eefc;--ai:#f3f3f5;--bd:#e2e2e6}
@media(prefers-color-scheme:dark){:root{--bg:#161618;--fg:#ececee;--mut:#88888c;--me:#26324f;--ai:#232326;--bd:#323236}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh}
header{padding:10px 16px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;color:var(--mut);font-size:13px}
#log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;max-width:820px;width:100%;margin:0 auto}
.m{padding:10px 14px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word;max-width:90%}
.u{background:var(--me);align-self:flex-end}.a{background:var(--ai);align-self:flex-start}
form{display:flex;gap:8px;padding:12px 16px;max-width:820px;width:100%;margin:0 auto}
textarea{flex:1;resize:none;font:inherit;color:inherit;background:var(--ai);border:1px solid var(--bd);border-radius:10px;padding:10px;height:46px}
button{font:inherit;border:0;border-radius:10px;padding:0 18px;background:#3b6cf6;color:#fff;cursor:pointer}button:disabled{opacity:.5}
</style></head><body>
<header><span>LastEngine</span><span id="st"></span></header>
<div id="log"></div>
<form id="f"><textarea id="t" placeholder="Message…" autofocus></textarea><button id="b">Send</button></form>
<script>
const log=document.getElementById('log'),t=document.getElementById('t'),b=document.getElementById('b'),st=document.getElementById('st');
let hist=[];
function add(c,x){const d=document.createElement('div');d.className='m '+c;d.textContent=x;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
async function send(){
  const q=t.value.trim();if(!q)return;t.value='';b.disabled=true;
  hist.push({role:'user',content:q});add('u',q);const d=add('a','…');let out='',th='',n=0,t0=performance.now();
  try{
    const r=await fetch('/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist,stream:true,max_tokens:1024})});
    const rd=r.body.getReader(),dc=new TextDecoder();let buf='';
    for(;;){const {done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});
      const parts=buf.split('\n');buf=parts.pop();
      for(const l of parts){if(!l.startsWith('data:'))continue;const s=l.slice(5).trim();if(s==='[DONE]')continue;
        try{const j=JSON.parse(s);const dl=j.choices?.[0]?.delta||{};if(dl.reasoning_content){th+=dl.reasoning_content;d.textContent=th;d.style.opacity=.6}const c=dl.content;if(c){if(!out){d.style.opacity=1}out+=c;n++;d.textContent=out;log.scrollTop=log.scrollHeight;
          st.textContent=(n/((performance.now()-t0)/1000)).toFixed(1)+' chunks/s'}}catch(e){}}}
    hist.push({role:'assistant',content:out});
  }catch(e){d.textContent='Error: '+e}
  b.disabled=false;t.focus();
}
document.getElementById('f').onsubmit=e=>{e.preventDefault();send()};
t.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
</script></body></html>
